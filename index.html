<script>
/* ============ EDITABLE CONTENT (equivalent of src/data/story.ts) ============ */
const STORY={
  recipientName:"Gian", occasion:"Monthsary", celebrationDay:26,
  openingTitle:"FOR GIAN", openingMessage:"I made a little something for you.",
  openingSubtitle:"A little world, a little walk, and a letter meant only for you.",
  discoveryMessage:"There's something for you.",
  letterTitle:"To my favorite person, Gian.",
  // PLACEHOLDER: replace with your own words. One string per paragraph.
  letterBody:[
    "Happy Monthsary to us Langga!",
    "I hope you’re doing well langga. i know in the past weeks is hard for us. i get jealous bisan guti na bagay, deri mapakali pag deri ka ka chat. i have become more sensitive and vulnerable this past few days and i dont know why. i know that you’re having a hard time ha pag commute and to your night shift duty. The moment i courted you, I am already committed kon ano mayda kita. I am deeply honest, faithful, and inlove haimo ga. i want to cherish you. i want to be selfish and keep you for myself. But i know too much isnt good.",
    "I don’t want my love to become something that makes you feel suffocated. I want to learn how to give you space without making you feel that I’m becoming distant. I know I still have things to work on, especially with my jealousy and overthinking. I’m not perfect, but I’m willing to understand myself better for the sake of us.",
    "I hope that we can always be honest with each other, no matter what happens. I want you to be honest with me, even when the truth is difficult to tell. I do trust you, ga, and I hope we can continue building that trust through honesty and understanding. I don’t want us to hide things from each other just because we’re afraid of how the other might react.",
    "Happy monthsary to us, akon langga na malabad! May we celebrate many more monthsaries together. I hope my love for you feels like peace rather than a storm. I am looking forward to seeing our future together and achieving so many things in life. I hope everything gets better for you, especially when it comes to your health. Always remember that so many good things will happen to you because you are one of the most wonderful people I’ve ever known."
  ],
  closing:"I love you, ga and happy monthsary!",
  finalMessage:"Here's to all the little moments we haven't experienced yet.",
  finalScreenTitle:"Happy Monthsary, Gian.",
  finalScreenMessage:"Every little moment with you is a memory I want to keep.",

$('o-sub').textContent=STORY.openingSubtitle;$('p-msg').textContent=STORY.discoveryMessage;

const gt=new THREE.CanvasTexture(gc);gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(40,40);gt.encoding=THREE.sRGBEncoding;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120,1,1),new THREE.MeshStandardMaterial({map:gt,roughness:1}));

  [1.5,0,16],[-0.5,0,11],[-1.8,0,6],[-0.6,0,2],[1.4,0,-1.5],[2.6,0,-4]

  d.position.set(p.x+side*(i%2?1:-1)*.5,.04,p.z+(rnd()-.5)*.3);
  d.rotation.set(0,rnd()*6,0);d.scale.set(.7+rnd()*.7,1,.7+rnd()*.7);d.updateMatrix();stones.setMatrixAt(i,d.matrix);}

function tree(x,z,s){const g=new THREE.Group();
  const h=3.5*s;const tr=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.3*s,h,7),mat('#5a4633'));tr.position.y=h/2;tr.castShadow=true;g.add(tr);

  colliders.push({x,z,r:.35*s+.25});g.position.set(x,0,z);return g}
const leafBlobs=[],colliders=[];
for(let i=0;i<(mobile?22:38);i++){

  const near=pathCurve.getPoints(40).some(p=>Math.hypot(p.x-x,p.z-z)<3.2);
  if(near)continue;scene.add(tree(x,z,.9+rnd()*.9))}
/* Background trees for depth */
for(let i=0;i<14;i++)scene.add(tree(-25+i*4+rnd()*2,-24-rnd()*8,1.6+rnd()))

/* Grass tufts, ferns, flowers (instanced) */
function scatter(geo,material,n,range,fn){const m=new THREE.InstancedMesh(geo,material,n);m.castShadow=false;let k=0;
  while(k<n){const x=(rnd()-.5)*range[0],z=range[1]+rnd()*range[2];
    if(pathCurve.getPoints(60).some(p=>Math.hypot(p.x-x,p.z-z)<1.1))continue;
    d.position.set(x,0,z);d.rotation.set(0,rnd()*6,0);const s=fn(d);d.scale.setScalar(s);d.updateMatrix();m.setMatrixAt(k++,d.matrix)}
  scene.add(m);return m}
const bladeGeo=new THREE.ConeGeometry(.05,.5,3);bladeGeo.translate(0,.25,0);
const grass=scatter(bladeGeo,mat('#ffffff'),mobile?2400:7000,[44,-16,38],o=>.6+rnd()*1.3);
{const gp=['#829A6C','#6f8f5c','#a3b583','#5b7d4f','#c3c98e'];for(let i=0;i<grass.count;i++)grass.setColorAt(i,C(gp[i%5]));grass.instanceColor.needsUpdate=true}
const fernGeo=new THREE.ConeGeometry(.35,.7,5,1,true);fernGeo.translate(0,.35,0);
const fernMat=mat('#28583D');fernMat.side=THREE.DoubleSide;
scatter(fernGeo,fernMat,mobile?60:130,[34,-12,30],o=>.7+rnd()*.8);
const flowerGeo=new THREE.SphereGeometry(.07,6,5);flowerGeo.translate(0,.35,0);
const fl=scatter(flowerGeo,mat('#ffffff',.7),mobile?140:320,[34,-14,34],o=>.8+rnd()*.6);
{const fp=['#F5F0E5','#D6C18B','#c9b8e0','#e8b9b4','#F5F0E5'];for(let i=0;i<fl.count;i++)fl.setColorAt(i,C(fp[i%5]));fl.instanceColor.needsUpdate=true}
/* Moss rocks */
for(let i=0;i<16;i++){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.3+rnd()*.5,0),mat(rnd()>.5?'#829A6C':'#6f7d63',1));
  const x=(rnd()-.5)*18,z=-6+rnd()*20;if(pathCurve.getPoints(40).some(p=>Math.hypot(p.x-x,p.z-z)<1.6))continue;
  r.position.set(x,.15,z);r.scale.y=.6;r.castShadow=r.receiveShadow=true;scene.add(r)}

/* Bench */
const woodMat=mat('#765C43',.85),bench=new THREE.Group();
function box(w,h,dp,x,y,z,m=woodMat){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,dp),m);b.position.set(x,y,z);b.castShadow=b.receiveShadow=true;bench.add(b);return b}
for(let i=0;i<4;i++)box(1.7,.05,.1,0,.5,-.2+i*.13);        // seat slats
for(let i=0;i<3;i++)box(1.7,.07,.04,0,.75+i*.15,-.33);    // back slats
box(.08,.5,.5,-.78,.25,0);box(.08,.5,.5,.78,.25,0);box(.08,.95,.05,-.78,.7,-.33);box(.08,.95,.05,.78,.7,-.33);
bench.position.set(3.7,0,-4.2);bench.rotation.y=-Math.PI/2.4;scene.add(bench);
const benchPos=new THREE.Vector3(3.7,0,-4.2);

/* ===== Scenery enhancement ===== */
const stoneLt=mat('#9aa08f',.95),ceramic=mat('#F5F0E5',.6),extras={};
function onPath(t,off){const p=pathCurve.getPoint(t),g=pathCurve.getTangent(t);return new THREE.Vector3(p.x+g.z*off,0,p.z-g.x*off)}
/* path edge stones with moss */
{const n=120,m=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(.16,0),mat('#ffffff',1),n);
 for(let i=0;i<n;i++){const t=(i>>1)/(n/2-1),s=i%2?1:-1,p=onPath(t,s*(1.05+rnd()*.35));d.position.set(p.x,.06,p.z);d.rotation.set(rnd()*3,rnd()*3,rnd()*3);d.scale.set(.8+rnd()*.9,.5+rnd()*.5,.8+rnd()*.9);d.updateMatrix();m.setMatrixAt(i,d.matrix);m.setColorAt(i,C(rnd()>.5?'#829A6C':'#8f9684'))}
 m.castShadow=m.receiveShadow=true;scene.add(m)}
/* flowering bushes */
function bush(x,z,s,blossom){const g=new THREE.Group();
 for(let i=0;i<5;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(.45*s,1),mat(['#28583D','#426B49','#193B2C'][i%3],.95));b.position.set((rnd()-.5)*.8*s,.3*s+rnd()*.25*s,(rnd()-.5)*.8*s);b.castShadow=true;g.add(b)}
 for(let i=0;i<14&&blossom;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(.07*s,6,5),mat(blossom,.6));const a=rnd()*6.28,h=rnd()*.5;f.position.set(Math.cos(a)*.6*s,.35*s+h*s,Math.sin(a)*.6*s);g.add(f)}
 g.position.set(x,0,z);scene.add(g)}
['#c9b8e0','#F5F0E5','#e8b9b4','#9db4d8','#F5F0E5','#D6C18B'].forEach((c,i)=>{[-1,1].forEach(s=>{const p=onPath(.12+i*.14+(s>0?.05:0),s*(2.2+rnd()*.8));bush(p.x,p.z,.9+rnd()*.5,c)})});
bush(5.2,-5.6,1.2,'#e8b9b4');bush(1.8,-5.9,1.1,'#c9b8e0');
/* stone lantern */
{const L=new THREE.Group();const base=new THREE.Mesh(new THREE.CylinderGeometry(.16,.2,.2,6),stoneLt),post=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,.6,6),stoneLt);post.position.y=.4;
 const cage=new THREE.Mesh(new THREE.BoxGeometry(.3,.26,.3),new THREE.MeshStandardMaterial({color:'#9aa08f',transparent:true,opacity:.45}));cage.position.y=.84;
 const lamp=new THREE.Mesh(new THREE.BoxGeometry(.18,.16,.18),new THREE.MeshBasicMaterial({color:0xffd98a}));lamp.position.y=.84;
 const cap=new THREE.Mesh(new THREE.ConeGeometry(.28,.2,4),stoneLt);cap.position.y=1.07;cap.rotation.y=Math.PI/4;
 L.add(base,post,cage,lamp,cap);L.children.forEach(c=>c.castShadow=true);L.position.set(5.0,.1,-3.0);scene.add(L)}
/* pond with lily pads and rim stones */
{const w=new THREE.Mesh(new THREE.CircleGeometry(2.6,32),new THREE.MeshStandardMaterial({color:'#2f5a52',roughness:.08,metalness:.35}));w.rotation.x=-Math.PI/2;w.position.set(-6.5,.03,-1.5);w.scale.set(1.3,1,.8);scene.add(w);extras.water=w;
 for(let i=0;i<10;i++){const a=rnd()*6.28,r=rnd()*2;const pad=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.01,10),mat('#426B49',.7));pad.position.set(-6.5+Math.cos(a)*r*1.3,.045,-1.5+Math.sin(a)*r*.8);scene.add(pad)}
 for(let i=0;i<26;i++){const a=i/26*6.28;const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.22+rnd()*.15,0),mat('#8f9684',1));r.position.set(-6.5+Math.cos(a)*3.8,.1,-1.5+Math.sin(a)*2.3);r.scale.y=.6;r.castShadow=true;scene.add(r)}}
/* vine trellis arch at the start of the path */
{const p=pathCurve.getPoint(.1),g=pathCurve.getTangent(.1),A=new THREE.Group();
 [-1.5,1.5].forEach(x=>{const po=new THREE.Mesh(new THREE.BoxGeometry(.12,2.6,.12),woodMat);po.position.set(x,1.3,0);po.castShadow=true;A.add(po)});
 const top=new THREE.Mesh(new THREE.TorusGeometry(1.5,.06,6,24,Math.PI),woodMat);top.position.y=2.6;top.scale.y=.45;top.castShadow=true;A.add(top);
 for(let i=0;i<46;i++){const a=rnd()*Math.PI,s=rnd()>.5?1:-1;const v=new THREE.Mesh(new THREE.IcosahedronGeometry(.1+rnd()*.07,0),mat(rnd()>.8?'#e8b9b4':'#426B49',.9));
  if(rnd()>.45)v.position.set(Math.cos(a)*1.5,2.6+Math.sin(a)*.68,0);else v.position.set(s*1.5,.4+rnd()*2.3,0);v.position.z+=(rnd()-.5)*.1;A.add(v)}
 A.position.set(p.x,0,p.z);A.rotation.y=Math.atan2(g.x,g.z);scene.add(A)}
/* flower pot by the bench */
{const pot=new THREE.Mesh(new THREE.CylinderGeometry(.18,.13,.3,12),ceramic);pot.position.set(4.9,.15,-4.9);pot.castShadow=true;scene.add(pot);
 for(let i=0;i<7;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(.12,7,6),mat(['#e8b9b4','#F5F0E5','#c9b8e0'][i%3],.7));f.position.set(4.9+(rnd()-.5)*.3,.42+rnd()*.15,-4.9+(rnd()-.5)*.3);scene.add(f)}}

 function padMove(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=(e.clientX-cx)/(r.width/2),dy=(e.clientY-cy)/(r.height/2);const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=-dy;knob.style.transform='translate('+dx*34+'px,'+dy*34+'px)'}
 pad.addEventListener('pointerdown',e=>{padId=e.pointerId;pad.setPointerCapture(e.pointerId);padMove(e)});
 pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padMove(e)});
 const padEnd=e=>{if(e.pointerId===padId){padId=null;joy.x=joy.y=0;knob.style.transform=''}};
 pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);
 $('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQ=true});}
addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k===' '){jumpQ=true;e.preventDefault()}else if(k==='Shift')keys.shift=true;else keys[k]=true});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;if(k==='Shift')keys.shift=false;else keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.x=joy.y=0});
let dofLook=0;
function setState(s){state=s;tState=0}

/* Camera shot targets */
const tmp=new THREE.Vector3(),tmp2=new THREE.Vector3();
function followCam(dt,aheadBias=0){
  const p=pathCurve.getPoint(clamp(pathU,0,1)),tg=pathCurve.getTangent(clamp(pathU,0,1));
  const back=mobile?4.6:3.6,up=mobile?2.3:1.9,side=mobile?0:.7;
  tmp.set(p.x-tg.x*back+tg.z*side*-1,up,p.z-tg.z*back+tg.x*side);
  tmp2.set(p.x+tg.x*3,1.2,p.z+tg.z*3+aheadBias);
  camPos.lerp(tmp,1-Math.pow(.02,dt));camLook.lerp(tmp2,1-Math.pow(.03,dt));
}
function place(){cam.position.copy(camPos);cam.lookAt(camLook)}

function startWalking(){setState('establishing');camPos.set(8,9,26);camLook.set(1,1.5,2)}

function update(dt){
  tState+=dt;
  const t=performance.now()/1000;
  // wind
  leafBlobs.forEach(l=>{l.position.x+=Math.sin(t*.8+l.userData.sway)*.0004;l.rotation.z=Math.sin(t*.7+l.userData.sway)*.03});
  fl.rotation.z=Math.sin(t*.9)*.01;
  motes.rotation.y=t*.01;const mp=motes.geometry.attributes.position;
  for(let i=0;i<mp.count;i++){mp.setY(i,mp.getY(i)+Math.sin(t*.5+i)*.0015+.0006);if(mp.getY(i)>6)mp.setY(i,.3)}mp.needsUpdate=true;
  sunRays.material.opacity=.07+Math.sin(t*.6)*.015;animateExtras(t,dt);

  let walking=false;
  if(state==='establishing'){
    const k=ease(clamp(tState/(reduced?3:6),0,1));
    tmp.set(lerp(8,2,k),lerp(9,2.4,k),lerp(26,19,k));tmp2.set(0,lerp(1.5,1.2,k),lerp(0,4,k));
    camPos.copy(tmp);camLook.copy(tmp2);
    if(k>=1){setState('free');showControls(true)}
  }else if(state==='free'){
    walking=stepPlayer(dt);
    const fx=Math.sin(camYaw),fz=Math.cos(camYaw),back=mobile?4.8:3.8,up=mobile?2.5:2.1;
    camPos.lerp(tmp.set(ctl.x-fx*back,ctl.y*.4+up,ctl.z-fz*back),1-Math.pow(.02,dt));
    for(const c of colliders){const dx=camPos.x-c.x,dz=camPos.z-c.z,dd=Math.hypot(dx,dz)||.01;if(dd<c.r+.4&&camPos.y<4.5){camPos.x=c.x+dx/dd*(c.r+.4);camPos.z=c.z+dz/dd*(c.r+.4)}}
    camLook.lerp(tmp2.set(ctl.x+fx*2,1.2+ctl.y*.3,ctl.z+fz*2),1-Math.pow(.03,dt));
    const near=Math.hypot(ctl.x-env.position.x,ctl.z-env.position.z)<2.8;
    if(near!==nearEnv){nearEnv=near;$('prompt').classList.toggle('hide',!near)}
  }else if(state==='discovering'){
    // glide to over-the-shoulder, gentle push-in on envelope
    const k=ease(clamp(tState/4,0,1));
    const p=pathCurve.getPoint(WALK_END);
    tmp.set(lerp(camPos.x,p.x-1.6,k*.04+.0),2.0-k*.3,lerp(camPos.z,p.z+2.0,k*.04));
    camPos.lerp(tmp.set(p.x-1.7,1.7,p.z+1.9),1-Math.pow(.15,dt));
    camLook.lerp(env.position,1-Math.pow(.1,dt));
    if(tState>3)setState('letter-ready');
  }else if(state==='letter-ready'){
    camPos.lerp(tmp.set(env.position.x-1.1,1.35,env.position.z+1.1),1-Math.pow(.3,dt));
    camLook.lerp(env.position,1-Math.pow(.1,dt));
  }else if(state==='letter-opening'){
    // beats: 0-3 approach & tilt, 3-5 seal breaks, 5-7 flap, 7-9 paper rises
    const a=ease(clamp(tState/3,0,1));
    tmp.set(env.position.x-.1,env.position.y+.85-a*.35,env.position.z+.55);
    camPos.lerp(tmp,1-Math.pow(.12,dt));camLook.lerp(tmp2.set(env.position.x,env.position.y+.05,env.position.z),1-Math.pow(.05,dt));
    env.position.y=lerp(envHome.y,envHome.y+.35,a);
    env.rotation.x=lerp(0,-.55,a);env.rotation.y=lerp(.35,0,a);
    if(tState>3){const s=ease(clamp((tState-3)/1.5,0,1));seal.scale.setScalar(1-s);seal.position.y=.012+s*.05;seal.material.opacity=1}
    if(tState>4.5){const f=ease(clamp((tState-4.5)/2,0,1));flapPivot.rotation.x=-f*Math.PI*.92}
    if(tState>6.5){letterSheet.visible=true;const r=ease(clamp((tState-6.5)/2,0,1));letterSheet.position.y=.014+r*.25;letterSheet.rotation.x=0}
    blur=clamp(tState/3,0,1);
    if(tState>9.2){setState('reading');$('letter').classList.remove('hide')}
  }else if(state==='reading'){
    camLook.lerp(tmp.set(env.position.x,env.position.y,env.position.z),.02);
  }else if(state==='finale'){
    const k=ease(clamp(tState/8,0,1));
    tmp.set(lerp(camPos.x,6,k*.025+.0),lerp(camPos.y,3.2,.01),camPos.z);
    camPos.lerp(tmp2.set(6,3.4,5),1-Math.pow(.6,dt));camLook.lerp(tmp.set(3.2,1.1,-4),1-Math.pow(.2,dt));
  }

  // character locomotion
  gian.visible=state!=='opening';
  if(state==='free'){gian.position.set(ctl.x,ctl.y,ctl.z);gian.rotation.y=lerpAngle(gian.rotation.y,ctl.yaw,1-Math.pow(.001,dt))}
  else if(state==='letter-opening'||state==='letter-ready'||state==='reading'){gian.rotation.y=lerpAngle(gian.rotation.y,Math.atan2(env.position.x-gian.position.x,env.position.z-gian.position.z),.05)}
  const w=walking?speed:0;walkT+=dt*(w*7);
  const sw=Math.sin(walkT),amp=clamp(w,0,1)*.55;
  legL.rotation.x=sw*amp;legR.rotation.x=-sw*amp;armL.rotation.x=-sw*amp*.7;armR.rotation.x=sw*amp*.7;
  hips.position.y=.95+Math.abs(Math.cos(walkT))*.03*clamp(w,0,1)+Math.sin(t*1.4)*.004;
  hips.rotation.y=sw*.07*clamp(w,0,1);torso.rotation.z=sw*.02*clamp(w,0,1);
  if(state==='free'&&ctl.y>.03){legL.rotation.x=-.7;legR.rotation.x=.25;armL.rotation.x=-1.1;armR.rotation.x=-1.1}
  const reach=(state==='discovering'||state==='letter-ready'||state==='letter-opening'||(state==='free'&&nearEnv))?1:0;
  headG.rotation.x=lerp(headG.rotation.x,reach?.25:0,.05);
  armR.rotation.x=lerp(armR.rotation.x,reach&&!walking?-.9:armR.rotation.x,.06);
  if(state==='opening'||state==='establishing'){gian.visible=true;gian.position.copy(pathCurve.getPoint(0));gian.rotation.y=Math.PI}
  // focus emphasis: darken & soften background via fog on opening beat
  scene.fog.density=lerp(.03,.075,ease(blur));
  place();
}
function lerpAngle(a,b,t){let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t}

/* ============ PARTICLES & LIGHT SHAFTS ============ */
const N=mobile?60:160,pg=new THREE.BufferGeometry(),pa=new Float32Array(N*3);
for(let i=0;i<N;i++){pa[i*3]=(rnd()-.5)*22;pa[i*3+1]=.3+rnd()*5;pa[i*3+2]=-8+rnd()*28}
pg.setAttribute('position',new THREE.BufferAttribute(pa,3));
const motes=new THREE.Points(pg,new THREE.PointsMaterial({color:0xfff0c2,size:.06,transparent:true,opacity:.75,depthWrite:false}));scene.add(motes);
const sunRays=new THREE.Mesh(new THREE.PlaneGeometry(8,22),new THREE.MeshBasicMaterial({color:0xffe6a8,transparent:true,opacity:.08,depthWrite:false,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
sunRays.position.set(-5,6,-6);sunRays.rotation.set(.2,.6,.5);scene.add(sunRays);

/* ============ AUDIO (procedural, optional, starts muted) ============ */
let actx=null,master=null,audioOn=false;
function startAudio(){
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  if(!master){master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
    // breeze: filtered noise
    const buf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=Math.random()*2-1;
    const src=actx.createBufferSource();src.buffer=buf;src.loop=true;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=.5;
    const g=actx.createGain();g.gain.value=.05;src.connect(f);f.connect(g);g.connect(master);src.start();
    const lfo=actx.createOscillator(),lg=actx.createGain();lfo.frequency.value=.1;lg.gain.value=250;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
    // soft pad + sparse piano-like notes (original, synthesized)
    const notes=[261.6,329.6,392,349.2,293.7,440];let i=0;
    setInterval(()=>{if(!audioOn)return;const o=actx.createOscillator(),e=actx.createGain();o.type='sine';o.frequency.value=notes[i++%notes.length]*(i%7===0?.5:1);
      e.gain.setValueAtTime(0,actx.currentTime);e.gain.linearRampToValueAtTime(.12,actx.currentTime+.03);e.gain.exponentialRampToValueAtTime(.0005,actx.currentTime+3.2);
      o.connect(e);e.connect(master);o.start();o.stop(actx.currentTime+3.3)},2600);
  }
  actx.resume();
}
function footstep(){if(!audioOn||!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=70+Math.random()*20;
  g.gain.setValueAtTime(.08,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+.09);o.connect(g);g.connect(master);o.start();o.stop(actx.currentTime+.1)}
let lastSign=0;setInterval(()=>{if(state==='free'&&moving&&ctl.y<.05){const s=Math.sin(walkT)>0?1:-1;if(s!==lastSign){lastSign=s;footstep()}}},40);
$('sound').onclick=()=>{audioOn=!audioOn;if(audioOn)startAudio();if(master)master.gain.linearRampToValueAtTime(audioOn?.9:0,actx.currentTime+.4);
  $('sound').textContent=audioOn?'SOUND ON':'SOUND OFF';$('sound').setAttribute('aria-pressed',audioOn)};

/* ============ INTERACTION ============ */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
function tryOpen(e){
  if(!(state==='free'&&nearEnv))return;
  const pt=e.touches?e.touches[0]:e;mouse.set(pt.clientX/innerWidth*2-1,-(pt.clientY/innerHeight)*2+1);
  ray.setFromCamera(mouse,cam);
  if(ray.intersectObject(hit).length||ray.intersectObject(body).length){openLetter()}
}
let drag=null;
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0,id:e.pointerId}});
renderer.domElement.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){const dx=e.clientX-drag.x;drag.moved+=Math.abs(dx)+Math.abs(e.clientY-drag.y);drag.x=e.clientX;drag.y=e.clientY;if(state==='free')camYaw+=dx*.006}});
renderer.domElement.addEventListener('pointerup',e=>{if(drag&&drag.moved<8)tryOpen(e);drag=null});
renderer.domElement.addEventListener('pointermove',e=>{if(state==='letter-ready'){mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mouse,cam);renderer.domElement.style.cursor=ray.intersectObject(hit).length?'pointer':'default'}});
$('begin').onclick=()=>{$('opening').classList.add('hide');startWalking()};
$('stay').onclick=()=>{$('letter').classList.add('hide');setState('finale');$('finale').classList.remove('hide')};
$('replay').onclick=()=>{
  $('finale').classList.add('hide');$('fade').style.opacity=1;
  setTimeout(()=>{pathU=0;speed=1;blur=0;env.position.copy(envHome);env.rotation.set(0,.35,0);flapPivot.rotation.x=0;seal.scale.setScalar(1);seal.position.y=.012;letterSheet.visible=false;letterSheet.position.y=.014;
    ctl.x=1.5;ctl.z=16;ctl.y=0;ctl.vy=0;ctl.yaw=Math.PI;camYaw=Math.PI;nearEnv=false;gian.rotation.y=Math.PI;startWalking();$('fade').style.opacity=0},2600)};

/* ============ LOOP ============ */
let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;update(dt);renderer.render(scene,cam);requestAnimationFrame(frame)}
function boot(){
  if(!renderer.getContext()){$('load').innerHTML='<p style="max-width:30ch">This device cannot show the 3D garden. The letter is still yours: open it on a newer phone or computer.</p>';return}
  camPos.set(8,9,26);camLook.set(1,1.5,2);state='opening';$('load').classList.add('hide');$('opening').classList.remove('hide');$('fade').style.opacity=0;
  requestAnimationFrame(frame)
}
setTimeout(boot,400);
